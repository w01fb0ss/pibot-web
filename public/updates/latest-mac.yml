releaseNotes: '{"zh":["修复：添加执行端时配对码显示为 [REDACTED]，无法配对","修复：Bot 浏览器打开大型网站（如 X）时窗口会卡住好几秒；截图和读页面也不再卡住界面","修复：窗口连接中断会取消 Bot 正在做的事","Bot 说「已导出 / 已生成某文件」却没发给你时，回复里提到的、这一轮做出来的文件会自动作为文件卡片附上；说「已附上」却没发时会注明","Bot 不再把 Pi Bot 的运行状态当成回复发出；偶尔一轮什么都没说时会自动再问一次","运行中补充消息：可在「立即补充」和「等这轮结束」之间切换；整理上下文时先等着不丢；停止时没发出的补充退回输入框；会显示正在等什么","侧栏搜索覆盖全部消息（不再只搜最近 1000 条），可以继续搜索更早的消息","外部 Agent 失败时说明原因（登录失效、额度用尽、限流、模型不可用）；运行中发给它的消息会在这一轮结束后按顺序发出","群聊模板合并为 5 个，卡片上写明各自适合做什么","「从这里重来」在文件夹无法管理时也能用；转发多条带附件的消息不再失败","图片 Bot 和模型暂时不可用的 Bot 也能正常整理记忆（改用默认模型）","很长的命令参数不再让审批失败；触控板轻滑向上不再弹回底部","提示缓存更稳定，长对话更快、更省","群成员权限里错误的「即将支持」标记已去掉"],"en":["Fixed: Add runner showed the pairing code as [REDACTED], so runners could not be paired","Fixed: the window froze for seconds while a Bot browsed large sites such as X; screenshots and page reads no longer block the window either","Fixed: a dropped window connection cancelled what Bots were doing","When a Bot says it exported or created a file but never sent it, files its reply names that this turn produced are attached as file cards; a reply claiming an attachment that was not sent gets a note","Bots no longer reply with Pi Bot''s runtime state; a turn that says nothing is asked once more automatically","Messages sent mid-run can switch between \"add now\" and \"after this turn\", wait during context compaction instead of being lost, return to the box if never sent, and show what they wait for","Sidebar search covers every message (no longer only the latest 1,000) and can continue into older ones","External agents say why they failed (sign-in expired, quota, rate limit, model unavailable); messages sent to them mid-turn go out in order after the turn","Group templates are merged into five, each card saying what it is for","Retry from here works when the folder cannot be managed; forwarding many messages with attachments no longer fails","Image Bots and Bots whose model is unavailable organize memories with the default model","Very long command arguments no longer break approval; a light trackpad scroll up no longer snaps back","Prompt caching is steadier, so long conversations are faster and cheaper","The wrong \"coming soon\" labels on group member permissions are gone"]}'
