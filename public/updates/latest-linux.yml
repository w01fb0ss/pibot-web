releaseNotes: '{"zh":["命令被联网设置拦截时，可直接选择当前 Bot、当前群或全局默认，将网站加入允许名单。","保存网站权限后仍需用户发起重试，命令审批、私网访问和沙箱隔离规则保持生效。","可以用 ChatGPT 计划登录了：设置 › 模型与密钥 › OpenAI › 「通过 ChatGPT 继续」（官方登录或 Codex 登录二选一），用你的 Go / Plus / Pro / Business 额度运行 OpenAI 模型，不需要 API Key","Bot 可以在配对的执行端（另一台电脑或服务器）上工作：提议换到执行端文件夹、在那台机器上跑命令；修复了配对后一直离线、Windows 执行端启动失败、macOS 托盘不显示等问题","外部 Agent（Codex、Claude Code、Cursor、OpenCode）可以作为 Bot 加入：在 Pi Bot 的沙箱里运行，能用 Bot 浏览器、发文件、用连接和技能，审批卡和审计与 Pi Bot 的 Bot 一致；关于你的记忆默认不发，按 Bot 打开","例行任务可以交给外部 Agent 跑，Bot 也可以把一步工作委派给 Agent Bot 并拿回结果（新权限「交给外部 Agent」，默认询问）","手机连电脑默认允许打洞直连，不在同一网络也能直连；电脑关着时手机能用自己的模型继续聊，回来后自动同步","MCP 和插件可以「从来源更新」并逐项对比改了什么；启动失败时说明原因（缺依赖、沙箱拦截等）","编辑器通过 ACP 连接时，可以切换 Bot 的模型、思考强度和全局默认模型","全新界面：欢迎页、新对话、选角色、设置、侧栏和聊天统一成更清爽的卡片风格","所有设置改了就生效，不用再点保存（API Key、密码等仍需确认保存）","Bot 的回复按真实顺序显示：先说要做什么，再显示做了哪些步骤；一轮结束只出现一张结尾卡（交付文件、改动文件和工作收据）","工作收据显示改了几个文件、跑了几条命令、审批几次和用时；预算用完可以直接加预算继续","代码审查可以选别的 Bot 来审，也能打开写完代码后自动审查","Mac 欢迎页检查屏幕录制、辅助功能和自动化三个权限，没开的会引导你去开；关掉权限后状态会立刻更新","小译收到任何文字默认直接翻译","更新页会显示每个版本的更新内容","公开版暂不提供 Gmail 连接。内置 Gmail 需要通过 Google 对受限邮件权限的验证和可能要求的安全评估。"],"en":["When network settings block a command, add the website directly for this Bot, this group, or the global default.","Saving a website permission waits for an explicit retry and preserves command approval, private-network consent, and sandbox isolation.","Sign in with your ChatGPT plan: Models & keys › OpenAI › Continue with ChatGPT (official or Codex sign-in) runs OpenAI models on your Go / Plus / Pro / Business allowance, no API key needed","Bots can work on a paired runner (another computer or server): they propose moving to a runner folder and run commands there. Fixed runners staying offline after pairing, the Windows runner failing to start and the macOS tray not appearing","External agents (Codex, Claude Code, Cursor, OpenCode) can join as Bots: they run in Pi Bot''s sandbox and use the Bot browser, file sending, connections and skills under the same approval cards and audit; memories about you are off by default, per Bot","Routines can run on an external agent, and a Bot can hand a step to an agent Bot and get the result back (new permission \"Hand work to external agents\", Ask by default)","The phone connects to your computer through NAT by default, so it connects directly even on another network; when the computer is off the phone keeps chatting on its own model and syncs back later","MCP servers and plugins can be updated from their source with a per-item comparison; a failed start says why (missing dependency, sandbox block, ...)","Editors connected through ACP can switch the Bot''s model, its thinking level and the app''s default model","A refreshed look across welcome, new chat, role picker, settings, sidebar and chat","Every setting takes effect as you change it, with no Save button (API keys and passwords still save explicitly)","Bot replies read in order: what it is about to do, then the steps it ran; each turn ends with one card for delivered files, changed files and the work receipt","Work receipts show files changed, commands run, approvals and time taken; a run stopped by its budget can continue right there","Choose which Bot reviews code, and optionally review automatically after code changes","On Mac, the welcome checks Screen Recording, Accessibility and Automation and guides you to turn on what is off; turning one off updates at once","Lingo translates whatever you send by default","The update page shows what each version changes","The public build omits Gmail. A built-in Gmail connection requires Google verification for restricted email scopes and may require a security assessment."]}'
