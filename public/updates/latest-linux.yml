releaseNotes: '{"zh":["v0.0.1 至 v0.0.3 是早期预览。v0.1.0 是第一个公开 Beta，把导入旧对话、分派任务、群组协作和跨设备跟进串成一套日常工作流程，因此版本号从 v0.0.3 升到了 v0.1.0。","桌面灵动岛与浏览器 · 切换窗口时也能查看后台 Bot 进度、步骤和执行位置，并在设置里选择显示内容。","浏览器扩展支持检测、安装引导和连接状态，可在常用浏览器操作网页，也可选择内置 Bot 浏览器。","导入会话与记忆 · 支持 ChatGPT、Claude、Gemini 导出文件及检测到的 Claude Code、Codex、Cursor、OpenCode、Antigravity。可预览、搜索、取消、继续话题和撤销整批导入，保留来源和时间。","分别审查并保存记忆、自定义指令和项目规则，可按次授权模型提炼历史记忆。超长消息可作为附件查看。","记忆可撤销、分类和设置有效期，可将项目事实提议写入项目说明。支持手动或空闲整理，合并重复项和检查过期项，并提供审核、预算、失败原因和模型回退。","Pi 分工与群组协作 · Pi 可查看设置、管理 Bot 和群组、诊断任务和按难度分派。需要确认的操作有审批卡，模型变动后可恢复任务。","群组计划显示进度和交付件，支持重试、跳过、改派与继续。自动来回默认 8 次，可设 1 至 10 次。新增一人公司、内容创作模板及 Antigravity CLI 接入，对外发送仍须确认。","模型、图片与视频 · 话题和群步骤可单独选模型。改善模型目录刷新和切换确认。检测到 Magpie 时显示接入，内核升级到 Pi 1.6.0。","支持批量生图、比较和复用，新增 Seedream、通义万相、Qwen Image、Grok Imagine 和 ComfyUI，扩展 ChatGPT 计划及兼容接口。新增自媒体工作台和生图灵感库，灵感库支持尝试翻译非英文搜索词。","支持按次审批的后台视频生成。可选默认模型或在审批卡换模型，支持 Google、OpenAI、OpenRouter 和自定义接口，视频与音频可在聊天播放。","连接、技能与知识库 · 斜杠菜单列出可用技能、应用和 MCP，含 /帮助。同一入口预览 MCP 配置、命令或网址。用表单建技能，一键准备环境。","本地知识库可按 Bot 授权。Python、Node、Git 和办公工具缺失时有指引。数据位置、备份、导入和清理更清楚，聊天字号可选三档。","Android、Runner 与平台支持 · Android 可看群进度、处理审批和待决定步骤，支持检查、下载并交给系统安装器更新。Runner 改善代理、配对和重连。","Linux 新增适配 Ubuntu AppArmor 的 .deb，改善回收站、文件读取和权限提示。Windows 支持更多盘符，改善只读命令与 YOLO 提示。电脑操作审批、macOS 技能隔离和外部 Agent 授权也有改进。","Bug 修复 · 聊天可显示模型服务商脱敏后的报错和 Gemini 兼容网关的流式错误。首次配置切换选项时清除旧报错。（#6、#8、#9）","私聊提炼记忆可使用超长消息节选；取消上下文估算不会影响同话题的其他估算；切换排队消息投递方式时保留顺序和附件。（#17、#19、#21）","修复部分 Windows 版本误判后台进程启动失败，以及浏览器扩展安装链接与连接问题、代理下 GitHub 等插件公网 API 被误拦。感谢社区贡献者。（#26）","改善大量话题下的滚动、聊天历史里的交付文件与图片、后台启动、群组状态和下载中断提示。上下文整理提示会自动收起。"],"en":["Versions 0.0.1 through 0.0.3 were early previews. We moved to 0.1.0 for the first public beta, which brings conversation import, task assignment, group collaboration and progress across devices into one workflow.","Desktop Live Island and browser · See the background Bot’s progress, current step and where work is running while switching windows. Choose what to show in Settings.","Pi Bot Browser detects the extension, guides installation and shows connection status. Work in your usual browser or choose the built-in Bot browser.","Conversation import and memory · Import ChatGPT, Claude and Gemini exports or detected Claude Code, Codex, Cursor, OpenCode and Antigravity sessions. Preview, search, cancel, continue or undo an import. Source and time are preserved.","Review memories, custom instructions and project rules separately. Approve model-assisted memory extraction per import. Read oversized messages as attachments.","Undo and organize memories, expire temporary decisions and propose project notes. Manual or idle cleanup merges duplicates and checks for expiry, with review, clearer budget and error details, and model fallback.","Pi assignment and groups · Pi can view settings, manage Bots and groups, diagnose stuck work and assign a model by difficulty. Approval cards cover confirmation, and work can recover from model changes.","Group plans show progress, outputs, retry, skip and reassign. Continue after workspace approval or the configurable round limit (1–10, default 8). New one-person company and content templates plus Antigravity CLI. External sends still require approval.","Models, images and video · Select per-topic or per-step models, refresh model catalogs and confirm provider changes. Magpie setup appears when detected. The agent kernel upgrades to Pi 1.6.0.","Generate, compare and reuse image batches. New Seedream, Wanx, Qwen Image, Grok Imagine and ComfyUI integrations, plus broader ChatGPT plan and compatible API support. Media Desk and Image Inspiration Library add creative planning and query translation.","Approve background video jobs, pick a default model or switch it on approval. Supports Google, OpenAI, OpenRouter and custom APIs. Play delivered video and audio in chat.","Connections, skills and knowledge · The slash menu lists available skills, apps and MCP, with /help. Preview MCP config, commands or URLs in one form. Create skills in a form and prepare their runtime.","Give individual Bots access to a local knowledge library. Get help when Python, Node, Git or office tools are missing. Data location, backup, import and cleanup are clearer. Choose from three chat text sizes.","Android, Runner and platforms · Follow group progress and resolve steps and approvals on Android, with update checks and downloads through the system installer. Runner improves proxy support, pairing and reconnection.","Linux adds an Ubuntu AppArmor .deb and improves file reads, trash and permission messages. Windows handles more drive paths with clearer read-only and YOLO behavior. Computer-use approvals, macOS skill isolation and external agent authorization improve.","Bug fixes · Surface redacted provider errors and streaming errors from Gemini-compatible gateways. Clear stale errors when switching setup options. (#6, #8, #9)","Use excerpts of oversized messages for memory extraction. Cancel one context estimate independently. Preserve order and attachments when changing queued delivery. (#17, #19, #21)","Fix incorrect Windows background startup failures, the browser extension store link and connection, and public API access for GitHub and other plugins on some proxy networks. Thanks to community contributors. (#26)","Improve scrolling in large topic lists, delivered files and images in history, background startup, group status and update interruption messages. The context cleanup notice dismisses automatically."]}'
